---
services:
  test-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: username
      # kics-scan ignore-line
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test
      TZ: Etc/GMT
    ports:
      - 127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432
    volumes:
      - ./init-postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d test"]
      interval: 5s
      timeout: 30s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - MKNOD
      - NET_RAW
      - SETFCAP
      - SYS_CHROOT
