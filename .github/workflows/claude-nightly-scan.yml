---
name: Claude Nightly Scan
on:
  schedule:
    - cron: '0 17 * * *'  # UTC 17:00 = JST 02:00
  workflow_dispatch:
    inputs:
      service:
        description: 'Target service (auto = day-of-week rotation)'
        required: false
        type: choice
        default: auto
        options:
          - auto
          - cocotola-auth
          - cocotola-question
          - cocotola-init
          - cocotola-lib
          - cocotola-audio-generator
      dry_run:
        description: 'Dry run (no issue creation)'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: claude-nightly-scan
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve target service
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      service: ${{ steps.pick.outputs.service }}
    steps:
      - id: pick
        env:
          OVERRIDE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE:-}" ] && [ "${OVERRIDE}" != "auto" ]; then
            SERVICE="${OVERRIDE}"
          else
            # UTC weekday: 1=Mon ... 7=Sun.
            # Cron fires at UTC 17:00 (= JST 02:00 the next calendar day).
            # We rotate on UTC weekday for stability; weekends are off.
            DOW=$(date -u +%u)
            case "${DOW}" in
              1) SERVICE="cocotola-auth" ;;
              2) SERVICE="cocotola-question" ;;
              3) SERVICE="cocotola-init" ;;
              4) SERVICE="cocotola-lib" ;;
              5) SERVICE="cocotola-audio-generator" ;;
              *) SERVICE="" ;;
            esac
          fi
          echo "service=${SERVICE}" >> "${GITHUB_OUTPUT}"
          if [ -z "${SERVICE}" ]; then
            echo "::notice::Weekend (UTC) — skipping nightly scan"
          else
            echo "::notice::Target service: ${SERVICE}"
          fi

  scan:
    name: Scan
    needs: resolve
    if: needs.resolve.outputs.service != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      TARGET_SERVICE: ${{ needs.resolve.outputs.service }}
      DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ secrets.APPS_APP_ID }}
          private-key: ${{ secrets.APPS_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Run Claude nightly scan
        id: claude
        uses: anthropics/claude-code-action@12310e4417c3473095c957cb311b3cf59a38d659 # v1.0.99
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          display_report: true
          # Temporary: surface Claude's tool stream so we can see which tool
          # calls are being denied and why scans report "no findings". Flip
          # back to false (or drop the line) once allowedTools is tuned.
          show_full_output: true
          prompt: |
            あなたは cocotola モノレポの夜間コード品質スキャンを担当します。

            ## 実行コンテキスト
            以下の環境変数が設定されています。Bash コマンド内では
            そのまま `$VAR` 形式で参照できます (例:
            `gh issue create --title "[Auto] $TARGET_SERVICE: ..."` )。
            - `TARGET_SERVICE`: 今夜スキャンするサービス名
            - `REPO`: `<owner>/<repo>`
            - `DRY_RUN`: `true` のとき起票しない
            - 本日の日付は `date -u +%Y-%m-%d` で取得

            ## ツール選択ガイド
            - **ファイル列挙は `Glob` を使う** (`find` は許可されていない)
              - 例: `Glob("$TARGET_SERVICE/**/*.go")` でサービス配下の全 Go ファイル
              - テスト除外は Glob 結果に対して `_test.go` を含むものを除く
            - **ファイル内容は `Read` で読む** (`cat` は許可されていない)
              - Read は line-numbered で返るので、末尾の行番号 = 総行数
            - **行数取得は `wc -l <path>`** (例: `wc -l $TARGET_SERVICE/**/*.go`)
              - bash の glob 展開で複数ファイルの行数を 1 コマンドで取得可能
            - **ディレクトリ確認は `Glob` で代用** (`ls` は許可されていない)
            - **Issue 本文は `Write` で `/tmp/issue_body_<N>.md` に書き、
              `gh issue create --body-file /tmp/issue_body_<N>.md` で渡す**。
              `--body "## 問題..."` のように markdown を直接渡そうとすると、
              Claude Code の bash 安全システムが「Newline followed by `#`」
              として弾く。
            - `find` / `ls` / `cat` は **試さない** (denial が積まれるだけ)。
            - 以下のパターンは Claude Code の bash 安全システムが
              ブロックするので **試さない** (denial で turn を浪費する):
              - `echo "...$VAR..."` 系 (simple_expansion)
              - `printenv` / `env` / `set` (multiple operations 扱い)
              - heredoc (`<<EOF`) — `Write` でファイル化する
              - バックスラッシュエスケープ (`\ ` / `\n` を含む引数)
              - ブレース展開と引用符の混在 (`{"key":"$VAR"}`)
              - 環境変数は `$VAR` 単独で引数として渡す形にする
                (例: `gh issue create --title "[Auto] $TARGET_SERVICE: ..."`)

            ## 手順

            1. **規約理解**: 以下を読む
               - `CLAUDE.md`
               - `docs/$TARGET_SERVICE.md` (存在すれば)
               - `.golangci.yml`

            2. **既存 Issue の重複チェック**:
               `gh issue list --label claude-proposal --state open --limit 100 --json number,title,body`
               で取得し、必要に応じて `gh issue view <番号>` で本文を確認する。
               - open な `claude-proposal` Issue が **10 件以上** ある場合は、
                 新規起票せず、最終応答に `skip: backlog full (count=N)` と
                 書いて終了する。
               - スキャン結果のすべてが既存 Issue でカバー済みの場合は、
                 ターンを浪費せず **即座に** `no actionable findings today`
                 と最終応答して終了する。新規性が低い「無理筋」の発見を
                 ひねり出して起票しない。

            3. **スキャン対象**: `$TARGET_SERVICE/` 配下のみ。
               以下の観点で最もインパクトの大きい問題を **最大 3 件** 抽出する:
               - 800 行を超えるファイル (分割候補)
               - 50 行を超える関数 (分解候補)
               - 4 階層を超えるネスト (リファクタ候補)
               - エラーハンドリングの匂い (ラップせず素通し、`nil, nil` リターン)
               - TODO/FIXME コメント (`git log -S` で 90 日以上前のもの優先)
               - 自明でない関数でテストが無いもの

               既存 open Issue と同じトピックは除外する。

            4. **Issue 起票 + ラベル付与** (DRY_RUN が `false` のときのみ):
               このリポジトリは GitHub App token で動いているため、
               `gh issue create --label <name>` を使うとラベルが
               **silently drop** されて空ラベルの Issue だけ作られる
               (stderr 空・exit 0 で気付けない)。そのため必ず
               **create と labeling を別コマンドに分離する**:

               ```
               # 1. ラベル無しで Issue を作って URL を取り出す
               URL=$(gh issue create \
                 --title "[Auto] $TARGET_SERVICE: <一行要約>" \
                 --body-file /tmp/issue_body_1.md)

               # 2. 番号を URL の末尾から取り出す
               NUM=${URL##*/}

               # 3. gh issue edit でまとめてラベルを付ける
               gh issue edit $NUM \
                 --add-label claude-proposal \
                 --add-label auto-generated \
                 --add-label "area/$TARGET_SERVICE" \
                 --add-label test
               ```

               - Title: `[Auto] <TARGET_SERVICE>: <一行要約>`
               - Labels (必ず `gh issue edit --add-label` で付与):
                 - `claude-proposal`
                 - `auto-generated`
                 - `area/<TARGET_SERVICE>`
                 - 種別ラベル 1 つ: `refactor` / `test` / `cleanup` / `tech-debt`
               - Body (Markdown):

                 ```
                 ## 問題
                 <何が問題か。`path/to/file.go:42` の形式で参照>

                 ## 提案
                 <具体的な修正方針>

                 ## 影響範囲
                 <変更が及ぶファイル・パッケージ>

                 ## 関連ファイル
                 - path/to/file.go:42
                 - path/to/other.go:100-150

                 ---
                 _Generated by Claude nightly scan on YYYY-MM-DD_
                 ```

               ラベルが無ければ `gh label create <name> --force` で作成
               (色の目安: `claude-proposal`=8A2BE2, `auto-generated`=cccccc,
               `area/*`=0e8a16, `refactor`=fbca04, `test`=1d76db,
               `cleanup`=c5def5, `tech-debt`=d93f0b)。

            5. **DRY_RUN=true** の場合:
               起票せず、発見内容を最終応答に Markdown で出力する
               (action が Job Summary に自動転載する)。

            ## 厳守事項
            - **ソースファイルを 1 つも変更しない**。Issue 起票のみ。
            - `Write` は **`/tmp/` 配下にのみ** 使うこと (Issue 本文の一時保存用)。
              リポジトリ内のファイルに `Write` しない。
            - PR を開かない。
            - 起票は **最大 3 件**。それ以上の発見があっても上位 3 件に絞る。
            - 同じファイル/関数の重複起票はしない。
            - 確信が持てない問題 (誤検知の可能性) は起票しない。

            ## 完了報告
            最終応答に以下のいずれかを必ず含める
            (action が Job Summary に転載する):
            - 起票した Issue 番号一覧 (例: `Created: #123, #124, #125`)
            - スキップ理由 (例: `skip: backlog full (count=12)`)
            - 発見ゼロ (例: `no actionable findings today`)
          claude_args: |
            --max-turns 90
            --allowedTools "Read,Glob,Grep,Write,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh label create:*),Bash(date:*),Bash(git log:*),Bash(wc -l cocotola-:*)"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set — skipping Slack notify"
            exit 0
          fi
          SINCE=$(date -u -d '90 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          if [ "${CLAUDE_OUTCOME}" != "success" ]; then
            TEXT=$(printf ':x: *Claude Nightly Scan* — `%s`\nstatus: %s\n<%s|Run log>' \
              "${TARGET_SERVICE}" "${CLAUDE_OUTCOME}" "${RUN_URL}")
          else
            RECENT=$(gh issue list \
              --repo "${REPO}" \
              --label claude-proposal \
              --state open \
              --limit 50 \
              --json number,title,url,createdAt \
              | jq --arg s "${SINCE}" --arg svc "${TARGET_SERVICE}" \
                  '[.[] | select(.createdAt > $s and
                                 (.title | startswith("[Auto] " + $svc + ":")))]')
            COUNT=$(echo "${RECENT}" | jq 'length')
            if [ "${DRY_RUN}" = "true" ]; then
              HEADER=$(printf ':test_tube: *Claude Nightly Scan (dry-run)* — `%s`' \
                "${TARGET_SERVICE}")
              BODY="dry-run complete"
            elif [ "${COUNT}" = "0" ]; then
              HEADER=$(printf ':crescent_moon: *Claude Nightly Scan* — `%s`' \
                "${TARGET_SERVICE}")
              BODY="完了 / 新規起票なし"
            else
              HEADER=$(printf ':crescent_moon: *Claude Nightly Scan* — `%s`' \
                "${TARGET_SERVICE}")
              LIST=$(echo "${RECENT}" \
                | jq -r '.[] | "• <\(.url)|#\(.number)> \(.title)"')
              BODY=$(printf '完了 / %s 件起票\n%s' "${COUNT}" "${LIST}")
            fi
            TEXT=$(printf '%s\n%s\n<%s|Run log>' "${HEADER}" "${BODY}" "${RUN_URL}")
          fi
          PAYLOAD=$(jq -n --arg text "${TEXT}" '{text: $text}')
          curl -sSf -X POST -H 'Content-Type: application/json' \
            --data "${PAYLOAD}" "${SLACK_WEBHOOK_URL}"
