---
name: Claude Nightly Scan
on:
  schedule:
    - cron: '0 17 * * *'  # UTC 17:00 = JST 02:00
  workflow_dispatch:
    inputs:
      service:
        description: 'Target service (auto = day-of-week rotation)'
        required: false
        type: choice
        default: auto
        options:
          - auto
          - cocotola-auth
          - cocotola-question
          - cocotola-init
          - cocotola-lib
          - cocotola-audio-generator
      dry_run:
        description: 'Dry run (no issue creation)'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: claude-nightly-scan
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve target service
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      service: ${{ steps.pick.outputs.service }}
    steps:
      - id: pick
        env:
          OVERRIDE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE:-}" ] && [ "${OVERRIDE}" != "auto" ]; then
            SERVICE="${OVERRIDE}"
          else
            # UTC weekday: 1=Mon ... 7=Sun.
            # Cron fires at UTC 17:00 (= JST 02:00 the next calendar day).
            # We rotate on UTC weekday for stability; weekends are off.
            DOW=$(date -u +%u)
            case "${DOW}" in
              1) SERVICE="cocotola-auth" ;;
              2) SERVICE="cocotola-question" ;;
              3) SERVICE="cocotola-init" ;;
              4) SERVICE="cocotola-lib" ;;
              5) SERVICE="cocotola-audio-generator" ;;
              *) SERVICE="" ;;
            esac
          fi
          echo "service=${SERVICE}" >> "${GITHUB_OUTPUT}"
          if [ -z "${SERVICE}" ]; then
            echo "::notice::Weekend (UTC) — skipping nightly scan"
          else
            echo "::notice::Target service: ${SERVICE}"
          fi

  scan:
    name: Scan
    needs: resolve
    if: needs.resolve.outputs.service != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      TARGET_SERVICE: ${{ needs.resolve.outputs.service }}
      DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
      REPO: ${{ github.repository }}
      MAX_OPEN_AUTO_ISSUES: 5
      MAX_NEW_ISSUES_PER_RUN: 3
      EXISTING_ISSUES_FILE: .nightly-scan/existing_auto_issues.json
      CREATED_KINDS_FILE: /tmp/created_issues.txt
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Collect existing auto issues
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
          mkdir -p "$(dirname "${EXISTING_ISSUES_FILE}")"
          gh issue list --repo "${REPO}" --state all \
            --search "\"[Auto] ${TARGET_SERVICE}:\" in:title" \
            --limit 500 --json number,title,state,stateReason,body,author \
            | jq --arg p "[Auto] ${TARGET_SERVICE}:" \
                '[.[] | select((.title | startswith($p)) and .author.is_bot
                               and (.state == "OPEN" or .stateReason == "NOT_PLANNED"))
                      | {number, title, state, stateReason, body: .body[0:600]}]' \
            > "${EXISTING_ISSUES_FILE}"
          OPEN=$(jq '[.[] | select(.state == "OPEN")] | length' "${EXISTING_ISSUES_FILE}")
          ROOM=$((MAX_OPEN_AUTO_ISSUES - OPEN))
          MAX_NEW=$((ROOM < MAX_NEW_ISSUES_PER_RUN ? ROOM : MAX_NEW_ISSUES_PER_RUN))
          echo "open_count=${OPEN}" >> "${GITHUB_OUTPUT}"
          echo "max_new=${MAX_NEW}" >> "${GITHUB_OUTPUT}"
          if [ "${MAX_NEW}" -le 0 ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::skip: backlog full (open=${OPEN}, max=${MAX_OPEN_AUTO_ISSUES})"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        if: steps.existing.outputs.skip == 'false'
        with:
          app-id: ${{ secrets.APPS_APP_ID }}
          private-key: ${{ secrets.APPS_PRIVATE_KEY }}

      - name: Run Claude nightly scan
        id: claude
        if: steps.existing.outputs.skip == 'false'
        timeout-minutes: 25
        uses: anthropics/claude-code-action@12310e4417c3473095c957cb311b3cf59a38d659 # v1.0.99
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          display_report: true
          # Temporary: surface Claude's tool stream so we can see which tool
          # calls are being denied and why scans report "no findings". Flip
          # back to false (or drop the line) once allowedTools is tuned.
          show_full_output: true
          prompt: |
            あなたは cocotola モノレポの夜間コード品質スキャンを担当します。

            ## 実行コンテキスト
            以下の環境変数が設定されています。Bash コマンド内では
            そのまま `$VAR` 形式で参照できます (例:
            `gh issue create --title "[Auto] $TARGET_SERVICE: ..."` )。
            - `TARGET_SERVICE`: 今夜スキャンするサービス名
            - `REPO`: `<owner>/<repo>`
            - `DRY_RUN`: `true` のとき起票しない
            - 本日の日付は `date -u +%Y-%m-%d` で取得

            ## ツール選択ガイド
            - **ファイル列挙は `Glob` を使う** (`find` は許可されていない)
              - 例: `Glob("$TARGET_SERVICE/**/*.go")` でサービス配下の全 Go ファイル
              - テスト除外は Glob 結果に対して `_test.go` を含むものを除く
            - **ファイル内容は `Read` で読む** (`cat` は許可されていない)
              - Read は line-numbered で返るので、末尾の行番号 = 総行数
            - **行数取得は `wc -l <path>`** (例: `wc -l $TARGET_SERVICE/**/*.go`)
              - bash の glob 展開で複数ファイルの行数を 1 コマンドで取得可能
            - **ディレクトリ確認は `Glob` で代用** (`ls` は許可されていない)
            - **Issue 本文は `Write` で `/tmp/issue_body_<N>.md` に書き、
              `gh issue create --body-file /tmp/issue_body_<N>.md` で渡す**。
              `--body "## 問題..."` のように markdown を直接渡そうとすると、
              Claude Code の bash 安全システムが「Newline followed by `#`」
              として弾く。
            - `find` / `ls` / `cat` は **試さない** (denial が積まれるだけ)。
            - 以下のパターンは Claude Code の bash 安全システムが
              ブロックするので **試さない** (denial で turn を浪費する):
              - `echo "...$VAR..."` 系 (simple_expansion)
              - `printenv` / `env` / `set` (multiple operations 扱い)
              - heredoc (`<<EOF`) — `Write` でファイル化する
              - バックスラッシュエスケープ (`\ ` / `\n` を含む引数)
              - ブレース展開と引用符の混在 (`{"key":"$VAR"}`)
              - 環境変数は `$VAR` 単独で引数として渡す形にする
                (例: `gh issue create --title "[Auto] $TARGET_SERVICE: ..."`)

            ## 手順

            1. **規約理解**: 以下を読む
               - `CLAUDE.md`
               - `docs/$TARGET_SERVICE.md` (存在すれば)
               - `.golangci.yml`

            2. **既存 Issue の重複チェック**:
               `${{ env.EXISTING_ISSUES_FILE }}` を `Read` で読む。
               このサービスの `[Auto]` Issue のうち、open のものと
               not planned でクローズされたもの (却下済みの提案) が入っている。
               - これらと同じファイル・関数・トピックの問題は起票しない。
                 not planned のものは却下済みなので、言い換えて再提案もしない。
               - スキャン結果のすべてが既存 Issue でカバー済みの場合は、
                 ターンを浪費せず **即座に** `no actionable findings today`
                 と最終応答して終了する。新規性が低い「無理筋」の発見を
                 ひねり出して起票しない。

            3. **スキャン対象**: `$TARGET_SERVICE/` 配下のみ。
               以下の観点で最もインパクトの大きい問題を **最大 ${{ steps.existing.outputs.max_new }} 件** 抽出する:
               - 800 行を超えるファイル (分割候補)
               - 50 行を超える関数 (分解候補)
               - 4 階層を超えるネスト (リファクタ候補)
               - エラーハンドリングの匂い (ラップせず素通し、`nil, nil` リターン)
               - TODO/FIXME コメント (`git log -S` で 90 日以上前のもの優先)
               - 自明でない関数でテストが無いもの

            4. **Issue 起票** (DRY_RUN が `false` のときのみ):
               `gh issue create --title "[Auto] $TARGET_SERVICE: <一行要約>" --body-file /tmp/issue_body_<N>.md`
               で起票する。出力の URL 末尾が Issue 番号。
               ラベルは後続のステップが付けるので、`--label` も `gh issue edit` も使わない。
               すべての起票が終わったら、起票した Issue ごとに「番号 種別」を 1 行ずつ並べた内容を
               `${{ env.CREATED_KINDS_FILE }}` に **1 回の `Write` でまとめて** 書く
               (種別は `refactor` / `test` / `cleanup` / `tech-debt` のいずれか 1 つ。
               例: 1 行目 `123 test`、2 行目 `124 refactor`)。
               - Title: `[Auto] <TARGET_SERVICE>: <一行要約>`
               - Body (Markdown):

                 ```
                 ## 問題
                 <何が問題か。`path/to/file.go:42` の形式で参照>

                 ## 提案
                 <具体的な修正方針>

                 ## 影響範囲
                 <変更が及ぶファイル・パッケージ>

                 ## 関連ファイル
                 - path/to/file.go:42
                 - path/to/other.go:100-150

                 ---
                 _Generated by Claude nightly scan on YYYY-MM-DD_
                 ```

            5. **DRY_RUN=true** の場合:
               起票せず、発見内容を最終応答に Markdown で出力する
               (action が Job Summary に自動転載する)。

            ## 厳守事項
            - **ソースファイルを 1 つも変更しない**。Issue 起票のみ。
            - `Write` は **`/tmp/` 配下にのみ** 使うこと (Issue 本文と種別の一時保存用)。
              リポジトリ内のファイルに `Write` しない。
            - PR を開かない。
            - 起票は **最大 ${{ steps.existing.outputs.max_new }} 件**。それ以上の発見があっても上位に絞る。
            - 同じファイル/関数の重複起票はしない。
            - 確信が持てない問題 (誤検知の可能性) は起票しない。

            ## 完了報告
            最終応答に以下のいずれかを必ず含める
            (action が Job Summary に転載する):
            - 起票した Issue 番号一覧 (例: `Created: #123, #124, #125`)
            - 発見ゼロ (例: `no actionable findings today`)
          claude_args: |
            --max-turns 90
            --allowedTools "Read,Glob,Grep,Write,Bash(gh issue view:*),Bash(gh issue create:*),Bash(date:*),Bash(git log:*),Bash(wc -l cocotola-:*)"

      - name: Label created issues
        id: label
        if: ${{ !cancelled() && steps.existing.outputs.skip == 'false' && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.existing.outputs.started_at }}
        run: |
          set -euo pipefail
          CREATED=$(gh issue list --repo "${REPO}" --state open --limit 50 \
              --json number,title,url,createdAt,author \
            | jq -c --arg p "[Auto] ${TARGET_SERVICE}:" --arg s "${SINCE}" \
                '[.[] | select((.title | startswith($p)) and .createdAt >= $s and .author.is_bot)
                      | {number, title, url}]')
          echo "created=${CREATED}" >> "${GITHUB_OUTPUT}"
          if [ "$(echo "${CREATED}" | jq 'length')" -eq 0 ]; then
            exit 0
          fi
          declare -A COLORS=(
            [claude-proposal]=8A2BE2 [auto-generated]=cccccc ["area/${TARGET_SERVICE}"]=0e8a16
            [refactor]=fbca04 [test]=1d76db [cleanup]=c5def5 [tech-debt]=d93f0b
          )
          EXISTING_LABELS=$(gh label list --repo "${REPO}" --limit 500 --json name -q '.[].name')
          for LABEL in "${!COLORS[@]}"; do
            if ! grep -qxF "${LABEL}" <<< "${EXISTING_LABELS}"; then
              gh label create "${LABEL}" --repo "${REPO}" --color "${COLORS[${LABEL}]}"
            fi
          done
          FAILED=0
          for NUM in $(echo "${CREATED}" | jq -r '.[].number'); do
            LABELS=(claude-proposal auto-generated "area/${TARGET_SERVICE}")
            KIND=""
            if [ -f "${CREATED_KINDS_FILE}" ]; then
              KIND=$(grep -m1 -E "^${NUM} (refactor|test|cleanup|tech-debt)$" "${CREATED_KINDS_FILE}" | cut -d' ' -f2 || true)
            fi
            if [ -n "${KIND}" ]; then
              LABELS+=("${KIND}")
            else
              echo "::warning::#${NUM}: no valid kind recorded in ${CREATED_KINDS_FILE}"
            fi
            FIELDS=()
            for LABEL in "${LABELS[@]}"; do
              FIELDS+=(-f "labels[]=${LABEL}")
            done
            if ! gh api --method POST "repos/${REPO}/issues/${NUM}/labels" "${FIELDS[@]}" > /dev/null; then
              echo "::error::#${NUM}: add labels failed"
              FAILED=1
            fi
          done
          exit "${FAILED}"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXISTING_OUTCOME: ${{ steps.existing.outcome }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          LABEL_OUTCOME: ${{ steps.label.outcome }}
          SKIP: ${{ steps.existing.outputs.skip }}
          OPEN_COUNT: ${{ steps.existing.outputs.open_count }}
          CREATED: ${{ steps.label.outputs.created }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set — skipping Slack notify"
            exit 0
          fi
          if [ "${EXISTING_OUTCOME}" != "success" ]; then
            TEXT=$(printf ':x: *Claude Nightly Scan* — `%s`\ncollect existing issues: %s\n<%s|Run log>' \
              "${TARGET_SERVICE}" "${EXISTING_OUTCOME}" "${RUN_URL}")
          elif [ "${SKIP}" = "true" ]; then
            TEXT=$(printf ':crescent_moon: *Claude Nightly Scan* — `%s`\nskip: backlog full (open=%s, max=%s)\n<%s|Run log>' \
              "${TARGET_SERVICE}" "${OPEN_COUNT}" "${MAX_OPEN_AUTO_ISSUES}" "${RUN_URL}")
          else
            RECENT="${CREATED:-[]}"
            COUNT=$(echo "${RECENT}" | jq 'length')
            if [ "${CLAUDE_OUTCOME}" = "success" ]; then
              ICON=':crescent_moon:'
              STATUS='完了'
            else
              ICON=':x:'
              STATUS="status: ${CLAUDE_OUTCOME}"
            fi
            if [ "${DRY_RUN}" = "true" ]; then
              if [ "${CLAUDE_OUTCOME}" = "success" ]; then
                ICON=':test_tube:'
              fi
              HEADER=$(printf '%s *Claude Nightly Scan (dry-run)* — `%s`' \
                "${ICON}" "${TARGET_SERVICE}")
              BODY="${STATUS}"
            elif [ "${COUNT}" = "0" ]; then
              HEADER=$(printf '%s *Claude Nightly Scan* — `%s`' \
                "${ICON}" "${TARGET_SERVICE}")
              BODY="${STATUS} / 新規起票なし"
            else
              HEADER=$(printf '%s *Claude Nightly Scan* — `%s`' \
                "${ICON}" "${TARGET_SERVICE}")
              LIST=$(echo "${RECENT}" \
                | jq -r '.[] | "• <\(.url)|#\(.number)> \(.title)"')
              BODY=$(printf '%s / %s 件起票\n%s' "${STATUS}" "${COUNT}" "${LIST}")
            fi
            if [ "${LABEL_OUTCOME}" = "failure" ]; then
              BODY=$(printf '%s\n:warning: ラベル付与に失敗' "${BODY}")
            fi
            TEXT=$(printf '%s\n%s\n<%s|Run log>' "${HEADER}" "${BODY}" "${RUN_URL}")
          fi
          PAYLOAD=$(jq -n --arg text "${TEXT}" '{text: $text}')
          curl -sSf -X POST -H 'Content-Type: application/json' \
            --data "${PAYLOAD}" "${SLACK_WEBHOOK_URL}"
