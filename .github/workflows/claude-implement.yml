---
name: Claude Implement
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to implement'
        required: true
        type: string

permissions: {}

concurrency:
  group: claude-implement-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate trigger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'claude-approved' &&
       contains(github.event.issue.labels.*.name, 'claude-proposal'))
    permissions:
      issues: read
    outputs:
      issue_number: ${{ steps.check.outputs.issue_number }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_NUMBER: ${{ inputs.issue_number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            NUMBER="${DISPATCH_NUMBER}"
            LABELS=$(gh issue view "${NUMBER}" \
              --repo "${REPO}" \
              --json labels \
              --jq '[.labels[].name]')
            if ! echo "${LABELS}" | jq -e 'index("claude-proposal")' > /dev/null; then
              echo "::error::Issue #${NUMBER} lacks claude-proposal label"
              exit 1
            fi
            if ! echo "${LABELS}" | jq -e 'index("claude-approved")' > /dev/null; then
              echo "::error::Issue #${NUMBER} lacks claude-approved label"
              exit 1
            fi
          else
            NUMBER="${ISSUE_NUMBER}"
          fi
          echo "issue_number=${NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "::notice::Target Issue: #${NUMBER}"

  implement:
    name: Implement
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ secrets.APPS_APP_ID }}
          private-key: ${{ secrets.APPS_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Skip if existing PR closes this issue
        id: dedup
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          COUNT=$(gh pr list \
            --repo "${REPO}" \
            --state open \
            --search "in:body \"Closes #${ISSUE_NUMBER}\"" \
            --json number \
            --limit 5 | jq 'length')
          if [ "${COUNT}" -gt 0 ]; then
            echo "::notice::open PR already references #${ISSUE_NUMBER} — skipping"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create implementation branch
        if: steps.dedup.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="claude/issue-${ISSUE_NUMBER}"
          if git ls-remote --exit-code --heads origin "${BRANCH}" \
             > /dev/null 2>&1; then
            echo "::error::Branch ${BRANCH} already exists on origin — aborting"
            exit 1
          fi
          git switch -c "${BRANCH}"
          echo "::notice::Switched to ${BRANCH} (agent will commit here, not on main)"

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        if: steps.dedup.outputs.skip == 'false'
        with:
          go-version: 1.26.x

      - uses: bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77 # 0.18.0
        if: steps.dedup.outputs.skip == 'false'
        with:
          bazelisk-version: 1.x
          # Share the disk-cache key with test-pr.yml so we hit the warm cache
          # populated on main. Cold bazel from scratch is ~11 min; with cache
          # `task gazelle` finishes in seconds.
          disk-cache: go-bazel
          repository-cache: true

      - if: steps.dedup.outputs.skip == 'false'
        run: bazel info

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        if: steps.dedup.outputs.skip == 'false'
        with:
          repo-token: ${{ github.token }}

      - name: Run Claude implement
        id: claude
        if: steps.dedup.outputs.skip == 'false'
        timeout-minutes: 35
        uses: anthropics/claude-code-action@12310e4417c3473095c957cb311b3cf59a38d659 # v1.0.99
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          display_report: true
          branch_prefix: claude/issue-
          prompt: |
            あなたは cocotola モノレポの実装担当 Claude です。

            ## 実行コンテキスト (固定値)
            - **Target Issue**: #${{ needs.guard.outputs.issue_number }}
            - **Repository**: ${{ github.repository }}
            - **Working branch**: `claude/issue-${{ needs.guard.outputs.issue_number }}`
              (workflow が既に switch 済み)
            - 本日の日付は `date -u +%Y-%m-%d` で取得できる

            ## 最初に読め (Hard rules)
            - **`git push origin main` 禁止**。push 先は
              `claude/issue-${{ needs.guard.outputs.issue_number }}` のみ
            - **ブランチを変えない**。`git switch` / `git checkout` で別 branch に移らない
            - **対象 Issue は上記の固定値**。`gh issue list` で他の Issue を探したり、
              別 Issue を勝手に拾って実装しない
            - **環境変数 `$ISSUE_NUMBER` には頼らない** (この prompt の値が真の値)

            ## 手順

            1. **Issue 把握**: `gh issue view ${{ needs.guard.outputs.issue_number }}` で
               Issue 本文を読み、指摘内容・関連ファイル・提案を理解する。

            2. **規約読み込み**: 以下を読む
               - `CLAUDE.md`
               - Issue が指すサービスの `docs/<service>.md` (存在すれば)
               - `.golangci.yml`

            3. **既存コード把握**: Read / Glob / Grep で関連ファイルと
               周辺のテストパターンを確認する。

            4. **最小限の実装**: Issue で指摘された範囲のみを修正する。
               範囲外の "ついで" 修正をしない。

            5. **テスト**: 振る舞いが変わる箇所は Go ユニットテストを追加・更新する。
               既存のテストパターンに合わせる (テスト名
               `Test_<X>_should<Y>_when<Z>`、mockery、
               `given`/`when`/`then` コメント等)。

               **Go テストの落とし穴 (CI で必ず弾かれる)**:
               - `t.Setenv` を呼ぶテストでは **`t.Parallel()` を書かない**。
                 Go のテストフレームワークは「環境変数の変更 + 並列実行」を
                 検出すると panic させる (`testing: test using t.Setenv ...
                 can not use t.Parallel`)。環境変数を弄らないテストだけ
                 `t.Parallel()` を付ける。
               - `t.Chdir` も同じく `t.Parallel()` と併用不可。

            6. **BUILD.bazel 自動再生成 (必須)**:
               このリポジトリは Bazel で動いており、`*.go` を追加・改名・
               削除したり import を変えたら **必ず `task gazelle` を実行**
               して `BUILD.bazel` を再生成する。手で `BUILD.bazel` を編集
               しない (`embed`/`deps`/`srcs` のルールを誤ると CI で
               `undefined: <symbol>` などの compile エラーになる)。

               ```
               task gazelle
               git status   # BUILD.bazel に差分が出ているはず
               ```

               差分が出たら、次のコミットに `git add` で必ず含める。

            7. **コミット**:
               - `git add` で変更ファイルを明示的に追加 (`git add -A` 禁止)
               - 追加した `*.go` と `task gazelle` が生成した `BUILD.bazel` を
                 同じコミットに含める
               - `git commit -m "<type>: <short English summary>"`
                 (type は feat/fix/refactor/test/chore のいずれか)
               - **コミットメッセージは英語で書く** (Issue 本文が日本語でも)

            8. **PR 作成 (draft)**:
               `gh pr create --draft --title "..." --body "..."` で起こす。
               - **タイトル・本文すべて英語で書く** (Issue 本文が日本語でも)
               - Title: コミットメッセージと同じ `<type>: <short English summary>`
               - Body には以下を英語で含める:
                 ```
                 ## Summary
                 <what changed>

                 ## Why
                 <why this change is needed>

                 ## Test plan
                 - [ ] <reviewer-facing checklist item>

                 Closes #${{ needs.guard.outputs.issue_number }}
                 ```

            ## 厳守事項
            - **1 PR = 1 Issue**。Issue で指摘された範囲のみ変更する
            - **変更行数は合計 300 行以内**。超えそうなら詰め込まず、
              対応方針を PR 本文の `## Open questions` セクション (英語)
              に書いて Draft PR にする
            - **`task test` は実行しない** (CI に任せる、コスト削減)
            - **golangci-lint も実行しない** (CI に任せる)
            - **以下のファイルは変更しない**:
              - `Taskfile.yml`
              - `.golangci.yml`
              - `.github/**`
              - `**/*.gen.go`
            - エラーは `fmt.Errorf("...: %w", err)` でラップする
            - `slog` を使う (`fmt.Println` / `log.Printf` 禁止)
            - `nil, nil` を返さない (エンティティが無いときはセンチネルエラー)
            - 確信が持てない箇所は推測で書かず、PR 本文の
              `## Open questions` セクション (英語) で人間に判断を委ねる

            ## 完了報告
            最終応答に以下のいずれかを必ず含める:
            - `Created PR: #<num>` (成功)
            - `skip: <理由>` (実装不可と判断した場合)

            さらに `skip:` の場合は、Issue 本体にも理由を残す:
            `gh issue comment ${{ needs.guard.outputs.issue_number }} --body "skip: <英語の理由>"`
          claude_args: |
            --max-turns 120
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr list:*),Bash(date:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git config:*),Bash(git branch:*),Bash(task gazelle:*)"

      - name: Notify Slack
        if: always()
        timeout-minutes: 3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_URL: ${{ github.server_url }}/${{ github.repository }}/issues/${{ needs.guard.outputs.issue_number }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          DEDUP_SKIP: ${{ steps.dedup.outputs.skip }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set — skipping Slack notify"
            exit 0
          fi
          if [ "${DEDUP_SKIP}" = "true" ]; then
            HEADER=$(printf ':leftwards_arrow_with_hook: *Claude Implement* — skipped (existing PR for #%s)' \
              "${ISSUE_NUMBER}")
            BODY=$(printf 'Issue: <%s|#%s>' "${ISSUE_URL}" "${ISSUE_NUMBER}")
          elif [ "${CLAUDE_OUTCOME}" != "success" ]; then
            HEADER=":x: *Claude Implement* — failed"
            BODY=$(printf 'Issue: <%s|#%s>\nstatus: %s' \
              "${ISSUE_URL}" "${ISSUE_NUMBER}" "${CLAUDE_OUTCOME}")
          else
            PR_INFO=$(gh pr list \
              --repo "${REPO}" \
              --state open \
              --search "in:body \"Closes #${ISSUE_NUMBER}\"" \
              --json number,title,url \
              --limit 5 | jq '.[0] // empty')
            if [ -z "${PR_INFO}" ]; then
              HEADER=":hammer_and_wrench: *Claude Implement* — completed (no new PR)"
              BODY=$(printf 'Issue: <%s|#%s>' "${ISSUE_URL}" "${ISSUE_NUMBER}")
            else
              PR_NUM=$(echo "${PR_INFO}" | jq -r '.number')
              PR_URL=$(echo "${PR_INFO}" | jq -r '.url')
              PR_TITLE=$(echo "${PR_INFO}" | jq -r '.title')
              HEADER=$(printf ':hammer_and_wrench: *Claude Implement* — PR <%s|#%s> opened' \
                "${PR_URL}" "${PR_NUM}")
              BODY=$(printf 'Issue: <%s|#%s>\n%s' \
                "${ISSUE_URL}" "${ISSUE_NUMBER}" "${PR_TITLE}")
            fi
          fi
          TEXT=$(printf '%s\n%s\n<%s|Run log>' "${HEADER}" "${BODY}" "${RUN_URL}")
          PAYLOAD=$(jq -n --arg text "${TEXT}" '{text: $text}')
          curl -sSf -X POST -H 'Content-Type: application/json' \
            --data "${PAYLOAD}" "${SLACK_WEBHOOK_URL}"
