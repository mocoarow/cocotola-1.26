---
name: Deploy Production
on:
  push:
    tags:
      - "[0-9][0-9].[0-9][0-9].*"
  workflow_dispatch:
permissions: {}
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: production
      expected_project_id: mocoarow-cocotola
    secrets: inherit
