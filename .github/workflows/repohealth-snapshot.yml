---
name: Repohealth Snapshot
on:
  schedule:
    - cron: '0 0 1 * *'  # UTC 00:00 on the 1st = JST 09:00
  workflow_dispatch:

permissions: {}

concurrency:
  group: repohealth-snapshot
  cancel-in-progress: false

env:
  BRANCH_PREFIX: chore/repohealth-snapshot-
  ARTIFACT: repohealth-snapshot

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
      rev: ${{ steps.rev.outputs.rev }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          # snapshot fails on a shallow clone, since churn and monthly counts would silently shrink
          fetch-depth: 0
          persist-credentials: false

      # Taken before task health, so nothing it leaves running can change what publish checks out.
      - id: rev
        run: |
          set -euo pipefail
          REV=$(git rev-parse HEAD)
          echo "rev=${REV}" >> "${GITHUB_OUTPUT}"

      # Two open snapshot PRs would both append to history.jsonl, so the later merge would conflict.
      - name: Skip if a snapshot PR is open
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OPEN=$(gh pr list --repo "${REPO}" --state open --limit 1000 --json headRefName,isCrossRepository \
            --jq "[.[] | select((.isCrossRepository | not) and (.headRefName | startswith(\"${BRANCH_PREFIX}\")))] | length")
          if [ "${OPEN}" -gt 0 ]; then
            echo "::notice::a repohealth snapshot PR is still open — skipping"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: steps.guard.outputs.skip == 'false'
        with:
          go-version: 1.26.x

      - uses: bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77 # 0.18.0
        if: steps.guard.outputs.skip == 'false'
        with:
          bazelisk-version: 1.x
          # Reuse the cache Test Push keeps warm on main; a monthly run has no reason to save it.
          disk-cache: go-bazel
          repository-cache: true
          cache-save: false

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        if: steps.guard.outputs.skip == 'false'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        if: steps.guard.outputs.skip == 'false'
        with:
          aqua_version: v2.57.0

      - if: steps.guard.outputs.skip == 'false'
        run: task health

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.guard.outputs.skip == 'false'
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            .repohealth/history.jsonl
            .repohealth/latest.json
            .repohealth/REPORT.md
          if-no-files-found: error
          retention-days: 1

  # A separate runner, so no process that task health left behind can read the token that writes.
  publish:
    needs: measure
    if: needs.measure.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.measure.outputs.rev }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: .repohealth

      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ secrets.APPS_APP_ID }}
          private-key: ${{ secrets.APPS_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open a PR with the snapshot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          REV: ${{ needs.measure.outputs.rev }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          MONTH=$(date -u +%Y-%m)
          BRANCH="${BRANCH_PREFIX}${MONTH}"
          TITLE="chore: record repohealth snapshot ${MONTH}"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git add .repohealth/history.jsonl .repohealth/latest.json .repohealth/REPORT.md
          git commit -m "${TITLE}"
          git push origin "${BRANCH}"
          COMMIT=$(git rev-parse HEAD)
          BODY="${RUNNER_TEMP}/pr-body.md"
          {
            echo "Snapshot of ${REV}."
            echo
            echo "Report: ${SERVER_URL}/${REPO}/blob/${COMMIT}/.repohealth/REPORT.md"
          } > "${BODY}"
          gh pr create --repo "${REPO}" --base main --head "${BRANCH}" --title "${TITLE}" --body-file "${BODY}"
