---
name: Check Go
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions: {}
jobs:
  golang:
    permissions:
      checks: write
      contents: read
      pull-requests: write
    strategy:
      matrix:
        workdir:
          - hello-world
          - cocotola-auth
          - cocotola-init
          - cocotola-lib
          - cocotola-question
          - cocotola-audio-generator
    name: golang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files-specific
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47.0.0
        with:
          files: |
            ${{ matrix.workdir }}/**
            pkgforbid.yml
            Taskfile.yml
            .github/workflows/check-golang.yml

      - name: golangci-lint
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        uses: reviewdog/action-golangci-lint@c76cceaaab89abe74e649d2e34c6c9adc26662d2 # v2.10.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          golangci_lint_flags: --config=../.golangci.yml --timeout=10m
          tool_name: golangci-lint
          filter_mode: nofilter
          fail_on_error: true
          workdir: ${{ matrix.workdir }}

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: pkgforbid
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        run: task pkgforbid-go-project GO_PROJECT=${{ matrix.workdir }}
