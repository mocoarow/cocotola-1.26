---
AddQuestionRequest:
  type: object
  properties:
    questionType:
      type: string
      x-oapi-codegen-extra-tags:
        binding: required
      pattern: ^.*$
    content:
      type: string
      x-oapi-codegen-extra-tags:
        binding: required,max=10000
      maxLength: 10000
      pattern: ^.*$
    tags:
      type: array
      items:
        type: string
        maxLength: 100
        pattern: ^[a-zA-Z0-9_-]+:[a-zA-Z0-9_-]+$
      maxItems: 20
    orderIndex:
      type: integer
      format: int32
      x-oapi-codegen-extra-tags:
        binding: gte=0
  required:
    - questionType
    - content
    - orderIndex

UpdateQuestionRequest:
  type: object
  properties:
    content:
      type: string
      x-oapi-codegen-extra-tags:
        binding: required,max=10000
      maxLength: 10000
      pattern: ^.*$
    tags:
      type: array
      items:
        type: string
        maxLength: 100
        pattern: ^[a-zA-Z0-9_-]+:[a-zA-Z0-9_-]+$
      maxItems: 20
    orderIndex:
      type: integer
      format: int32
      x-oapi-codegen-extra-tags:
        binding: gte=0
  required:
    - content
    - orderIndex

QuestionResponse:
  type: object
  properties:
    questionId:
      type: string
      x-go-name: QuestionID
      pattern: ^.*$
    questionType:
      type: string
      pattern: ^.*$
    content:
      type: string
      pattern: ^.*$
    tags:
      type: array
      items:
        type: string
        maxLength: 100
        pattern: ^[a-zA-Z0-9_-]+:[a-zA-Z0-9_-]+$
      maxItems: 20
    orderIndex:
      type: integer
      format: int32
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    audio:
      $ref: '#/QuestionAudio'
      nullable: true
  required:
    - questionId
    - questionType
    - content
    - orderIndex
    - createdAt
    - updatedAt

QuestionAudio:
  type: object
  description: |
    Audio assets for a question. Each ref is always present in the wire
    payload due to value-type codegen, but an empty `url` ("") signals that
    the audio file has not been generated yet — clients must treat that the
    same as a missing key.
  properties:
    source:
      $ref: '#/QuestionAudioRef'
    target:
      $ref: '#/QuestionAudioRef'

QuestionAudioRef:
  type: object
  description: |
    A single audio file reference. `url` is empty ("") when the audio batch
    has not yet produced the file; clients should hide playback UI for that
    slot.
  properties:
    url:
      type: string
      pattern: ^.*$
    durationSec:
      type: number
      format: double
      minimum: 0
  required:
    - url
    - durationSec

ListQuestionsResponse:
  type: object
  properties:
    questions:
      type: array
      maxItems: 1000
      items:
        $ref: '#/QuestionResponse'
  required:
    - questions
