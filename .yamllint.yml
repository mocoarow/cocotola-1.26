---
extends: default

rules:
  # 80 chars should be enough, but don't fail if a line is longer.
  # 400 accommodates Claude Code allowedTools strings in workflow YAML.
  line-length:
    max: 400
  truthy: disable
  comments:
    min-spaces-from-content: 1

ignore:
  - swagger.yaml
  - pnpm-lock.yaml
  - analysis_options.yaml
  - pubspec.yaml
  - openapi/openapi.yaml
  - cocotola-auth/api/openapi-bundled.yaml
  - cocotola-question/api/openapi-bundled.yaml
  - cocotola-init/seed/seeds/public_workbooks.yaml
  - node_modules/
  - cocotola-web/node_modules/
  - .serena/
