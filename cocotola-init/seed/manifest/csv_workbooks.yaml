---
# Each entry maps one GCS CSV object to one public workbook. Workbook metadata
# lives here; question rows live in the CSV and are appended over time.
#
# Supported `format` values:
#   tatoeba-wordfill
#     Required CSV columns: id, srcText, blankText, blankAnswers
#     Optional CSV columns: tags (CEFR level), sourceType,
#       srcSentenceNumber, srcAuthor, dstSentenceNumber, dstAuthor
#     In this dataset the src* columns describe the target-language (en)
#     sentence and the dst* columns the source-language (ja) sentence.
csvWorkbooks:
  - seedKey: cefr-b1-wordfill-v1
    title: "穴埋め問題: CEFR B1 単語"
    description: "CEFR B1 レベルの語彙を学ぶ英文穴埋め問題集です。日本語の意味から英文の空欄を埋めます。"
    language: ja
    format: tatoeba-wordfill
    sourceLang: ja
    targetLang: en
    gcsObject: cefr_b1_questions.csv
